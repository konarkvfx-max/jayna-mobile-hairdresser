<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-page: #F4F1EB;
    --bg-card: #F9F7F3;
    --bg-secondary: #F0EDE8;
    --text-primary: #2C2C2A;
    --text-muted: #807F7B;
    --text-soft: #A6A29C;
    --primary: #8B9E8C;
    --primary-deep: #6F8472;
    --primary-soft: #D8DFD7;
    --on-primary: #FFFFFF;
    --border: #E4DFD7;
    --border-soft: #ECE7DF;
    --radius-btn: 8px;
    --radius-card: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Nunito Sans', -apple-system, system-ui, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior: none;
  }
  #root { min-height: 100dvh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; -webkit-tap-highlight-color: transparent; }
  input, select { font-family: inherit; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .screen { animation: screenIn 240ms cubic-bezier(.2,.8,.2,1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-in { animation: modalIn 260ms cubic-bezier(.2,.8,.2,1); }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .backdrop-in { animation: fadeIn 200ms ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fabIn {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
// ═══════════════════════════════════════════════════════════════
//  JAYNA — MOBILE HAIRDRESSER DAILY SCHEDULE
//  Single-file production frontend
//  API_URL is empty string = same-origin (Railway serves both)
// ═══════════════════════════════════════════════════════════════
const API_URL = '';

// ── Adelaide timezone helpers ─────────────────────────────────
function getAdelaideToday() {
  const parts = new Intl.DateTimeFormat('en-AU', {
    timeZone: 'Australia/Adelaide',
    year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(new Date());
  const p = {};
  parts.forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
  return `${p.year}-${p.month}-${p.day}`;
}

function isoLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseLocalDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// ── Icons ─────────────────────────────────────────────────────
const Icon = ({ name, size = 20, stroke = 'currentColor', fill = 'none', strokeWidth = 1.7, style: extraStyle }) => {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill, stroke, strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round', style: extraStyle };
  switch (name) {
    case 'phone':    return <svg {...p}><path d="M5 4.5h3.2l1.8 4-2 1.4a11.5 11.5 0 0 0 6.1 6.1l1.4-2 4 1.8V19a1.5 1.5 0 0 1-1.6 1.5C9.7 20 4 14.3 3.5 6.1A1.5 1.5 0 0 1 5 4.5z"/></svg>;
    case 'message':  return <svg {...p}><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-9l-4.5 3.5v-3.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/></svg>;
    case 'pin':      return <svg {...p}><path d="M12 21s7-6.2 7-11.3a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.7" r="2.5"/></svg>;
    case 'plus':     return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case 'check':    return <svg {...p}><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>;
    case 'clock':    return <svg {...p}><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>;
    case 'bell':     return <svg {...p}><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2H4.5l1.5-2z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>;
    case 'calendar': return <svg {...p}><rect x="3.5" y="5" width="17" height="15" rx="2.2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>;
    case 'scissors': return <svg {...p}><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 8l12 12M8 16L20 4"/></svg>;
    case 'x':        return <svg {...p}><path d="M6 6l12 12M18 6L6 18"/></svg>;
    case 'arrow-right': return <svg {...p}><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>;
    case 'dot':      return <svg {...p}><circle cx="12" cy="12" r="2.5" fill={stroke} stroke="none"/></svg>;
    case 'refresh':  return <svg {...p}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>;
    case 'wifi-off': return <svg {...p}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>;
    case 'car':      return <svg {...p}><path d="M5 17h14M7 17V9l2-4h6l2 4v8"/><circle cx="8.5" cy="17" r="1.5"/><circle cx="15.5" cy="17" r="1.5"/></svg>;
    case 'search':   return <svg {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>;
    case 'copy':     return <svg {...p}><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>;
    default: return null;
  }
};

// ── Avatar ────────────────────────────────────────────────────
const Avatar = ({ initials, tone = '#E8DFD2', size = 44 }) => (

    display: 'flex', alignItems: 'center', justifyContent: 'center',

);

// ── Pill ──────────────────────────────────────────────────────
const Pill = ({ children, tone = 'neutral' }) => {
  const c = { neutral: { bg: 'rgba(140,138,131,0.12)', fg: '#5e5d58' }, sage: { bg: 'rgba(139,158,140,0.18)', fg: '#4f624f' }, amber: { bg: 'rgba(199,145,69,0.16)', fg: '#7d5419' } }[tone] || { bg: 'rgba(140,138,131,0.12)', fg: '#5e5d58' };
  return (

};

// ══════════════════════════════════════════════════════════════
//  SHARED FORM STYLES & HELPER COMPONENTS
//  ⚠ These MUST be declared at module scope, NOT inside JSX.
//  Moving them here fixes the blank-screen crash.
// ══════════════════════════════════════════════════════════════
const inputStyle = {
  width: '100%', boxSizing: 'border-box', padding: '12px 14px',
  borderRadius: 'var(--radius-btn)', border: '1px solid var(--border-soft)',
  background: 'var(--bg-page)', fontFamily: 'inherit', fontSize: 14.5, fontWeight: 600,

const primaryBtnStyle = {
  flex: 1, padding: '14px 16px', borderRadius: 'var(--radius-btn)',

  display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,

};

const secondaryBtnStyle = {
  padding: '14px 18px', borderRadius: 'var(--radius-btn)',
  background: 'var(--bg-secondary)', color: 'var(--text-primary)',
  fontWeight: 800, fontSize: 14.5,
  border: '1px solid var(--border-soft)', cursor: 'pointer',

const stepperBtn = {
  width: 34, height: 34, borderRadius: 999,
  background: 'var(--bg-secondary)', border: '1px solid var(--border-soft)',
  color: 'var(--text-primary)', fontSize: 17, fontWeight: 800,

const Field = ({ label, children }) => (

const Chip = ({ active, onClick, children }) => (

const SheetModal = ({ title, subtitle, onClose, children }) => (

// ── Contact button inside booking card ───────────────────────
const ContactBtn = ({ name, label, onClick, divider }) => (
  <button onClick={onClick} style={{
    padding: '11px 8px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,

// ── Drive time row between cards ─────────────────────────────
const DriveTimeRow = ({ driveTime, hasConflict }) => {
  if (!driveTime) return null;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,

      <span>{driveTime.durationText}</span>
      {hasConflict && <span style={{ fontSize: 11, background: 'rgba(179,107,107,0.12)', color: '#B36B6B', padding: '2px 7px', borderRadius: 999 }}>⚠ tight</span>}
    </div>
  );
};

// ── Weekly date strip ─────────────────────────────────────────
const WeekStrip = ({ days, selected, onSelect, bookingDates, todayIso }) => {
  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    const el = scrollRef.current?.querySelector('[data-selected="true"]');
    if (el) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'instant' });
  }, []);

  return (
    <div ref={scrollRef} className="no-scrollbar" style={{ display: 'flex', gap: 8, overflowX: 'auto', overflowY: 'hidden', padding: '0 22px 4px' }}>
      {days.map(d => {
        const iso = isoLocal(d);
        const isSel = iso === selected;
        const isToday = iso === todayIso;
        const dayLetter = d.toLocaleDateString('en-AU', { weekday: 'short' }).slice(0, 3).toUpperCase();
        const dayNum = d.getDate();
        const hasBookings = bookingDates.includes(iso);
        return (
          <button key={iso} data-selected={isSel} onClick={() => onSelect(iso)} style={{
            flexShrink: 0, width: 46, height: 62, borderRadius: 999,
            background: isSel ? 'var(--primary)' : 'var(--bg-card)',
            border: '1px solid ' + (isSel ? 'transparent' : 'var(--border-soft)'),
            color: isSel ? '#fff' : 'var(--text-primary)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            padding: '6px 0', position: 'relative',
          }}>
            <span style={{ fontSize: 10, fontWeight: 800, letterSpacing: 0.6, opacity: isSel ? 0.85 : 0.55 }}>{dayLetter}</span>
            <span style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.3, marginTop: 2, lineHeight: 1 }}>{dayNum}</span>
            {hasBookings && !isSel && (
              <span style={{ position: 'absolute', bottom: 8, width: 4, height: 4, borderRadius: 999, background: 'var(--primary)' }} />
            )}
            {isToday && !isSel && (
              <span style={{ position: 'absolute', top: 5, right: 8, fontSize: 8, fontWeight: 800, color: 'var(--primary-deep)' }}>•</span>
            )}
          </button>
        );
      })}
    </div>
  );
};

// ── Booking card ──────────────────────────────────────────────
const BookingCard = ({ booking, onOpen }) => {
  const isPending = booking.status === 'pending';
  return (
    <Card onClick={() => onOpen(booking)} style={{ padding: 0 }}>
      <div style={{ padding: '16px 16px 14px', display: 'flex', gap: 14, alignItems: 'flex-start' }}>
        <Avatar initials={booking.initials} tone={booking.avatarTone} size={46} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
            <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: -0.2, color: 'var(--text-primary)' }}>{booking.client}</div>
            <div style={{ fontWeight: 800, fontSize: 16, whiteSpace: 'nowrap' }}>${booking.price}</div>
          </div>
          <div style={{ marginTop: 5, fontSize: 14.5, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6 }}>
            <Icon name="clock" size={14} strokeWidth={1.9} stroke="var(--text-muted)" />
            <span>{booking.time} – {booking.timeEnd}</span>
          </div>
          <div style={{ marginTop: 5, fontSize: 14, fontWeight: 600, display: 'flex', alignItems: 'flex-start', gap: 6 }}>
            <Icon name="scissors" size={13.5} strokeWidth={1.9} stroke="var(--text-muted)" style={{ marginTop: 2, flexShrink: 0 }} />
            <span style={{ flex: 1, lineHeight: 1.4 }}>{booking.services.join(', ')}</span>
          </div>
          <div style={{ marginTop: 5, fontSize: 13.5, color: 'var(--text-muted)', fontWeight: 600, display: 'flex', alignItems: 'flex-start', gap: 6 }}>
            <Icon name="pin" size={13.5} strokeWidth={1.9} style={{ marginTop: 2, flexShrink: 0 }} />
            <span style={{ flex: 1, lineHeight: 1.4 }}>{booking.address}</span>
          </div>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', borderTop: '1px solid var(--border-soft)' }}>
        <ContactBtn name="phone" label="Call" onClick={e => { e.stopPropagation(); window.location.href = `tel:${booking.phone}`; }} />
        <ContactBtn name="message" label="Text" onClick={e => { e.stopPropagation(); window.location.href = `sms:${booking.phone}`; }} divider />
        <ContactBtn name="pin" label="Maps" onClick={e => { e.stopPropagation(); window.open(`https://maps.google.com/?q=${encodeURIComponent(booking.address)}`, '_blank'); }} divider />
      </div>
      {isPending && (
        <div style={{
          padding: '8px 14px', borderTop: '1px solid var(--border-soft)',
          background: 'rgba(199,145,69,0.07)',
          display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 12.5, color: '#7d5419', fontWeight: 700,
          borderBottomLeftRadius: 'var(--radius-card)', borderBottomRightRadius: 'var(--radius-card)',
        }}>
          <Icon name="dot" size={12} stroke="#c79145" />
          Awaiting client confirmation
        </div>
      )}
    </Card>
  );
};

// ── Booking detail modal ──────────────────────────────────────
const DetailRow = ({ icon, label, children, last }) => (
  <div style={{
    display: 'flex', alignItems: 'flex-start', gap: 12,
    padding: '14px 14px',
    borderBottom: last ? 'none' : '1px solid var(--border-soft)',
  }}>
    <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--bg-secondary)', color: 'var(--text-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <Icon name={icon} size={15} strokeWidth={1.8} />
    </div>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-muted)', letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 3 }}>{label}</div>
      {children}
    </div>
  </div>
);

function shortAddress(addr) { return (addr || '').split(',')[0].trim(); }
function hasNotes(b) { return !!(b.notes || b.hairDescription || b.colourHistory || b.mobilityNeeds || b.extraNotes); }

const ActionTile = ({ icon, label, onClick, primary }) => (
  <button onClick={onClick} style={{
    padding: '14px 8px',
    background: primary ? 'var(--primary)' : 'var(--bg-secondary)',
    color: primary ? '#fff' : 'var(--text-primary)',
    border: '1px solid ' + (primary ? 'transparent' : 'var(--border-soft)'),
    borderRadius: 'var(--radius-btn)',
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
    fontWeight: 700, fontSize: 13,
  }}>
    <Icon name={icon} size={18} strokeWidth={1.9} />
    {label}
  </button>
);

const BookingDetailModal = ({ booking, onClose, onRefresh }) => {
  const [confirmed, setConfirmed] = React.useState(booking.status === 'confirmed');
  const [working, setWorking] = React.useState(false);
  const [showEdit, setShowEdit] = React.useState(false);
  const [editPhone, setEditPhone] = React.useState(booking.phone || '');
  const [editAddress, setEditAddress] = React.useState(booking.address || '');
  const [editDate, setEditDate] = React.useState(booking.date || '');
  const [editTime, setEditTime] = React.useState(booking.time || '');
  const [editPrice, setEditPrice] = React.useState(booking.price || '');
  const [editNotes, setEditNotes] = React.useState(booking.notes || '');

  const handleConfirm = async () => {
    setWorking(true);
    try {
      const res = await fetch(`${API_URL}/bookings/${booking.id}/confirm`, { method: 'POST' });
      if (res.ok) { setConfirmed(true); onRefresh?.(); }
    } catch (e) { console.error('Confirm error:', e); }
    setWorking(false);
  };

  const handleCancel = async () => {
    if (!window.confirm(`Cancel ${booking.client}'s appointment?`)) return;
    setWorking(true);
    try {
      await fetch(`${API_URL}/bookings/${booking.id}/cancel`, { method: 'POST' });
      onRefresh?.();
      onClose();
    } catch (e) { console.error('Cancel error:', e); }
    setWorking(false);
  };

  const handleEdit = async () => {
    setWorking(true);
    try {
      const isDaylight = (() => {
        const d = new Date(editDate);
        const day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
        return day >= 274 || day < 121;
      })();
      const offset = isDaylight ? '+10:30' : '+09:30';
      const startTime = `${editDate}T${editTime}:00${offset}`;

      const visitBody = {
        phone: editPhone,
        startTime,
        customFields: [
          { id: 'Tsg5TJ2XhBD523zVvenw', values: [editAddress] },
          { id: 'ZCuDrgB7eDIpoDxDV90v', values: [editPrice.toString()] },
        ],
      };

      const visitRes = await fetch(`${API_URL}/bookings/${booking.id}/edit`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(visitBody),
      });
      if (!visitRes.ok) throw new Error(`Visit update failed (${visitRes.status})`);

      if (editNotes && booking.customerId) {
        await fetch(`${API_URL}/customers/${booking.customerId}/notes`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customFields: [{ id: 'EsyazvahjsF62K862TEy', values: [editNotes] }],

      setShowEdit(false);
      onRefresh?.();

const NewBookingModal = ({ onClose, serviceCatalogue }) => {
  const today = getAdelaideToday();
  const [client, setClient] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [service, setService] = React.useState('');
  const [date, setDate] = React.useState(today);
  const [time, setTime] = React.useState('10:00');
  const [duration, setDuration] = React.useState(75);
  const [customDuration, setCustomDuration] = React.useState(false);
  const [address, setAddress] = React.useState('');
  const [saving, setSaving] = React.useState(false);

  const serviceOptions = serviceCatalogue?.length
    ? serviceCatalogue.map(s => s.name)
    : ['Haircut & Blow Dry', 'Foils / Highlights', 'Root Colour', 'All Over Colour', 'Blow Dry', 'Consultation'];

  const handleSave = async () => {
    if (!client.trim() || !address.trim()) {
      alert('Please fill in client name and address.');
      return;
    }
    setSaving(true);
    try {
      const serviceId = serviceCatalogue?.find(s => s.name === service)?.id;
      const [h, m] = time.split(':').map(Number);
      const start = parseLocalDate(date);
      start.setHours(h, m, 0, 0);
      const res = await fetch(`${API_URL}/bookings/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          services: serviceId ? [serviceId] : [],
          client: { name: client.trim(), phone: phone.trim() },
          startTime: start.toISOString(),
          customFields: [{ id: 'Tsg5TJ2XhBD523zVvenw', values: [address.trim()] }],
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      onClose(true);
    } catch (e) {
      console.error(e);
      alert('Couldn\'t create booking. Check your connection and try again.');
    }
    setSaving(false);
  };

  return (
    <SheetModal title="New booking" onClose={() => onClose()}>
      <Field label="Client name">
        <input value={client} onChange={e => setClient(e.target.value)} placeholder="e.g. Olivia Bennett" style={inputStyle} />
      </Field>
      <Field label="Phone">
        <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="+61 4xx xxx xxx" type="tel" style={inputStyle} />
      </Field>
      <Field label="Service">
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {serviceOptions.map(s => <Chip key={s} active={service === s} onClick={() => setService(s)}>{s}</Chip>)}
        </div>
      </Field>
      <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 10 }}>
        <Field label="Date">
          <input type="date" value={date} onChange={e => setDate(e.target.value)} style={inputStyle} />
        </Field>
        <Field label="Start time">
          <input type="time" value={time} onChange={e => setTime(e.target.value)} style={inputStyle} />
        </Field>
      </div>
      <Field label="Duration">
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {[45, 60, 75, 90, 120, 180].map(m => (
            <Chip key={m} active={!customDuration && duration === m} onClick={() => { setCustomDuration(false); setDuration(m); }}>{m}m</Chip>
          ))}
          <Chip active={customDuration} onClick={() => setCustomDuration(true)}>Custom</Chip>
        </div>
        {customDuration && (
          <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 10 }}>
            <input type="number" min="5" max="480" step="5" value={duration}
              onChange={e => setDuration(Number(e.target.value) || 0)} style={{ ...inputStyle, flex: 1 }} placeholder="Minutes" />
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: 'var(--text-muted)' }}>
              <button aria-label="Less" onClick={() => setDuration(d => Math.max(5, d - 5))} style={stepperBtn}>−</button>
              <span style={{ minWidth: 56, textAlign: 'center', color: 'var(--text-primary)' }}>
                {Math.floor(duration / 60) > 0 && `${Math.floor(duration / 60)}h `}{duration % 60 > 0 && `${duration % 60}m`}{duration === 0 && '0m'}
              </span>
              <button aria-label="More" onClick={() => setDuration(d => Math.min(480, d + 5))} style={stepperBtn}>+</button>
            </div>
          </div>
        )}
      </Field>
      <Field label="Address">
        <input value={address} onChange={e => setAddress(e.target.value)} placeholder="Client's home address" style={inputStyle} />
      </Field>
      <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
        <button onClick={() => onClose()} style={secondaryBtnStyle}>Cancel</button>
        <button onClick={handleSave} disabled={saving} style={{ ...primaryBtnStyle, opacity: saving ? 0.7 : 1 }}>
          <Icon name="check" size={16} strokeWidth={2.2} stroke="#fff" />
          {saving ? 'Saving…' : 'Add booking'}
        </button>
      </div>
    </SheetModal>
  );
};

// ── Main App ──────────────────────────────────────────────────
const App = () => {
  const todayIso = getAdelaideToday();
  const [bookings, setBookings] = React.useState([]);
  const [services, setServices] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [selected, setSelected] = React.useState(todayIso);
  const [activeBooking, setActiveBooking] = React.useState(null);
  const [fabOpen, setFabOpen] = React.useState(false);
  const [fabModal, setFabModal] = React.useState(null);
  const [showNotifications, setShowNotifications] = React.useState(false);

  const fetchBookings = React.useCallback(async () => {
    setError(null);
    try {
      const res = await fetch(`${API_URL}/bookings`);
      if (!res.ok) throw new Error(`Server error (${res.status})`);
      const data = await res.json();
      setBookings(data);
      const hasTodayBookings = data.some(b => b.date === todayIso);
      if (!hasTodayBookings) {
        const future = [...data].filter(b => b.date >= todayIso).sort((a, b) => a.date.localeCompare(b.date));
        if (future.length > 0) setSelected(future[0].date);
      }
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  }, [todayIso]);

  React.useEffect(() => {
    fetchBookings();
    fetch(`${API_URL}/services`).then(r => r.ok ? r.json() : []).then(setServices).catch(() => {});
    // WebSocket for live updates
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${location.host}`;
    let ws, retry;
    const connect = () => {
      try {
        ws = new WebSocket(wsUrl);
        ws.onmessage = ({ data }) => {
          try {
            const msg = JSON.parse(data);
            if (['booking_update', 'refresh', 'booking_created', 'booking_cancelled'].includes(msg.type)) {
              fetchBookings();
            }
          } catch {}
        };
        ws.onclose = () => { retry = setTimeout(connect, 5000); };
        ws.onerror = () => { ws.close(); };
      } catch {}
    };
    connect();
    return () => { ws?.close(); clearTimeout(retry); };
  }, [fetchBookings]);

  const bookingDates = React.useMemo(() => [...new Set(bookings.map(b => b.date))], [bookings]);
  const today = parseLocalDate(todayIso);
  const twoMonthsAhead = new Date(today.getFullYear(), today.getMonth() + 2, 0);
  const defaultDates = [];
  for (let d = new Date(today); d <= twoMonthsAhead; d.setDate(d.getDate() + 1)) {
    defaultDates.push(isoLocal(new Date(d)));
  }
  const allDates = [...new Set([...defaultDates, ...bookingDates])].sort();
  const days = allDates.map(d => parseLocalDate(d));
  const dayBookings = React.useMemo(() =>
    bookings.filter(b => b.date === selected).sort((a, b) => a.time.localeCompare(b.time)),
    [bookings, selected]
  );
  const pendingCount = bookings.filter(b => b.status === 'pending').length;

  const handleFabClose = (shouldRefresh) => {
    setFabModal(null);
    if (shouldRefresh) fetchBookings();
  };

  return (
    <div style={{ minHeight: '100dvh', background: 'var(--bg-page)', display: 'flex', flexDirection: 'column', fontFamily: "'Nunito Sans', -apple-system, system-ui, sans-serif", color: 'var(--text-primary)', maxWidth: 480, margin: '0 auto', position: 'relative' }}>

      {/* Header */}
      <div style={{
        padding: `max(env(safe-area-inset-top), 16px) 22px 8px`,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        background: 'var(--bg-page)', position: 'sticky', top: 0, zIndex: 50,
        borderBottom: '1px solid var(--border-soft)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <img src="/jayna-logo.png" alt="Jayna" style={{ width: 36, height: 36, borderRadius: 999, objectFit: 'cover' }} />
        </div>
        <button onClick={() => setShowNotifications(true)} style={{ width: 40, height: 40, borderRadius: 999, background: 'var(--bg-card)', border: '1px solid var(--border-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-primary)', position: 'relative' }}>
          <Icon name="bell" size={18} strokeWidth={1.8} />
          {pendingCount > 0 && (
            <span style={{ position: 'absolute', top: -3, right: -3, minWidth: 18, height: 18, padding: '0 5px', borderRadius: 999, background: '#C79145', color: '#fff', fontSize: 10.5, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid var(--bg-page)' }}>
              {pendingCount}
            </span>
          )}
        </button>
      </div>

      {/* Scrollable content */}
      <div className="no-scrollbar screen" style={{ flex: 1, overflowY: 'auto', paddingBottom: 110 }}>
        <div style={{ padding: '12px 22px 14px' }}>
          <div style={{ fontSize: 20, fontWeight: 800, letterSpacing: -0.4 }}>
            Hi Jayna, <span style={{ color: 'var(--text-muted)', fontWeight: 700 }}>here's your day.</span>
          </div>
          <div style={{ fontSize: 12.5, color: 'var(--text-muted)', marginTop: 3, fontWeight: 600 }}>
            {parseLocalDate(selected).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}
            {' · '}{dayBookings.length} appointment{dayBookings.length === 1 ? '' : 's'}
            {' · '}Adelaide
          </div>
        </div>

        <WeekStrip days={days} selected={selected} onSelect={setSelected} bookingDates={bookingDates} todayIso={todayIso} />

        <div style={{ padding: '16px 22px 0', display: 'flex', flexDirection: 'column', gap: 0 }}>
          {loading ? (
            <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border-soft)', borderRadius: 'var(--radius-card)', padding: '40px 22px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, color: 'var(--text-muted)' }}>
              <div style={{ width: 24, height: 24, border: '2px solid var(--border)', borderTopColor: 'var(--primary)', borderRadius: 999, animation: 'spin 0.8s linear infinite' }} />
              <div style={{ fontSize: 13, fontWeight: 600 }}>Loading schedule…</div>
            </div>
          ) : error ? (
            <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border-soft)', borderRadius: 'var(--radius-card)', padding: '32px 22px', textAlign: 'center' }}>
              <div style={{ width: 44, height: 44, borderRadius: 999, background: 'rgba(199,145,69,0.12)', color: '#C79145', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 10 }}>
                <Icon name="wifi-off" size={20} strokeWidth={1.8} />
              </div>
              <div style={{ fontWeight: 800, fontSize: 15.5, marginBottom: 4 }}>Couldn't load bookings</div>
              <div style={{ fontSize: 12.5, color: 'var(--text-muted)', fontWeight: 600, marginBottom: 16, lineHeight: 1.5 }}>{error}</div>
              <button onClick={fetchBookings} style={{ padding: '10px 20px', borderRadius: 'var(--radius-btn)', background: 'var(--primary)', color: '#fff', fontWeight: 700, fontSize: 13, border: 'none', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                <Icon name="refresh" size={14} strokeWidth={2.2} stroke="#fff" />
                Retry
              </button>
            </div>
          ) : dayBookings.length === 0 ? (
            <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border-soft)', borderRadius: 'var(--radius-card)', padding: '30px 22px', textAlign: 'center' }}>
              <div style={{ width: 44, height: 44, borderRadius: 999, background: 'var(--bg-secondary)', color: 'var(--text-muted)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 10 }}>
                <Icon name="calendar" size={20} strokeWidth={1.8} />
              </div>
              <div style={{ fontWeight: 800, fontSize: 15.5 }}>No appointments</div>
              <div style={{ fontSize: 12.5, color: 'var(--text-muted)', marginTop: 3, fontWeight: 600 }}>
                Tap + to book a client or block time.
              </div>
            </div>
          ) : (
            dayBookings.map((b, i) => (
              <React.Fragment key={b.id}>
                {i > 0 && <DriveTimeRow driveTime={b.driveTime} hasConflict={b.hasConflict} />}
                <div style={{ marginBottom: i < dayBookings.length - 1 ? 0 : 12 }}>
                  <BookingCard booking={b} onOpen={setActiveBooking} />
                </div>
              </React.Fragment>
            ))
          )}
        </div>
      </div>

      {/* Bottom bar & FAB */}
      <EarningsStrip dayBookings={dayBookings} allBookings={bookings} todayIso={todayIso} />
      <ExpandFAB open={fabOpen} setOpen={setFabOpen} onPick={kind => { setFabOpen(false); setFabModal(kind); }} />

      {/* Modals */}
      {activeBooking && (
        <BookingDetailModal
          booking={activeBooking}
          onClose={() => setActiveBooking(null)}
          onRefresh={fetchBookings}
        />
      )}
      {fabModal === 'new' && <NewBookingModal onClose={handleFabClose} serviceCatalogue={services} />}
      {fabModal === 'block' && <BlockTimeModal onClose={() => setFabModal(null)} />}

      {/* Pending notifications panel */}
      {showNotifications && (
        <div className="backdrop-in" style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(28,26,22,0.42)', backdropFilter: 'blur(2px)', display: 'flex', alignItems: 'flex-end' }} onClick={() => setShowNotifications(false)}>
          <div className="modal-in" onClick={e => e.stopPropagation()} style={{
            width: '100%', maxHeight: '80dvh', overflowY: 'auto',
            background: 'var(--bg-card)', borderTopLeftRadius: 24, borderTopRightRadius: 24,
            padding: '12px 20px max(env(safe-area-inset-bottom), 24px)',
          }}>
            <div style={{ width: 38, height: 4, borderRadius: 2, background: 'var(--border)', margin: '4px auto 14px' }} />
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 20, letterSpacing: -0.3 }}>Pending bookings</div>
              <button onClick={() => setShowNotifications(false)} style={{ width: 32, height: 32, borderRadius: 999, background: 'var(--bg-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-primary)' }}>
                <Icon name="x" size={16} strokeWidth={2.2} />
              </button>
            </div>
            {bookings.filter(b => b.status === 'pending').length === 0 ? (
              <div style={{ padding: '40px 20px', textAlign: 'center', color: 'var(--text-muted)' }}>
                <div style={{ fontSize: 15, fontWeight: 700 }}>No pending bookings</div>
                <div style={{ fontSize: 13, marginTop: 4, fontWeight: 600 }}>You're all caught up!</div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {bookings.filter(b => b.status === 'pending').map(booking => (
                  <button key={booking.id} onClick={() => { setShowNotifications(false); setActiveBooking(booking); }} style={{
                    padding: 0, background: 'var(--bg-secondary)', border: '1px solid var(--border-soft)',
                    borderRadius: 14, textAlign: 'left', cursor: 'pointer',
                  }}>
                    <div style={{ padding: '14px 16px', display: 'flex', gap: 12, alignItems: 'center' }}>
                      <Avatar initials={booking.initials} tone={booking.avatarTone} size={42} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 800, fontSize: 15.5, letterSpacing: -0.2 }}>{booking.client}</div>
                        <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 2, fontWeight: 600 }}>
                          {booking.services.join(', ')} · {booking.time}
                        </div>
                      </div>
                      <Icon name="arrow-right" size={16} strokeWidth={2} stroke="var(--text-muted)" />
                    </div>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
